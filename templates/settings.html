{% extends "base.html" %}{% block content %}{% set g=config.general %}{% set s=g.switching %}<section class="panel"><div class="panel-head"><div><h2>Switching safeguards</h2><p>These rules keep miners from bouncing between pools for fractions of a cent.</p></div></div><form class="form-grid" method="post" action="/settings/save">
<label>Global electricity $/kWh<input name="electricity_usd_kwh" type="number" step="0.001" value="{{ g.electricity_usd_kwh }}"></label><label>Minimum advantage %<input name="minimum_advantage_percent" type="number" step="0.1" value="{{ s.minimum_advantage_percent }}"></label>
<label>Minimum gain $/day<input name="minimum_net_improvement_usd_day" type="number" step="0.001" value="{{ s.minimum_net_improvement_usd_day }}"></label><label>Confirmation checks<input name="confirmation_checks" type="number" value="{{ s.confirmation_checks }}"></label>
<label>Minimum runtime hours<input name="minimum_runtime_hours" type="number" step="0.1" value="{{ s.minimum_runtime_hours }}"></label><label>Maximum switches / 24h<input name="maximum_switches_per_24h" type="number" value="{{ s.maximum_switches_per_24h }}"></label>
<label class="check"><input type="checkbox" name="dry_run" {% if g.get('dry_run',true) %}checked{% endif %}>Global dry-run mode</label><label class="check"><input type="checkbox" name="adopt_best_when_current_unknown" {% if s.get('adopt_best_when_current_unknown',false) %}checked{% endif %}>Allow auto-adoption when current profile is unknown</label><div class="span-2"><button class="button">Save settings</button></div></form></section>
<section class="panel"><div class="panel-head"><div><h2>Current state</h2></div></div><pre>{{ state|tojson(indent=2) }}</pre></section>{% endblock %}
